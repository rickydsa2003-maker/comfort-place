<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Comfort Place</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:'Quicksand', sans-serif;
    background:#020817;
}

/* BACKGROUND VIDEO */

.background-video{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:-2;
}

/* OVERLAY */

.overlay{

    position:fixed;

    inset:0;

    background:
    linear-gradient(
    180deg,
    rgba(5,10,25,0.35),
    rgba(8,15,35,0.55)
    );

    z-index:-1;
}

/* FLOATING LIGHTS */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:

    radial-gradient(circle at 20% 30%,
    rgba(173,216,255,0.12),
    transparent 20%),

    radial-gradient(circle at 80% 70%,
    rgba(255,182,193,0.08),
    transparent 20%),

    radial-gradient(circle at 50% 50%,
    rgba(255,255,255,0.05),
    transparent 25%);

    animation:floatGlow 10s ease-in-out infinite alternate;

    z-index:-1;
}

@keyframes floatGlow{

    from{
        transform:translateY(0px);
    }

    to{
        transform:translateY(-20px);
    }
}

/* MAIN CONTENT */

.content{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    transition:1.2s ease;
}

/* HIDDEN CONTENT */

.hidden-content{

opacity:0;

pointer-events:none;

transform:
translateY(40px);
}

/* GLASS BOX */

.text-box{

    text-align:center;

    padding:42px 34px;

    border-radius:30px;

    background:rgba(255,255,255,0.10);

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    border:1px solid rgba(255,255,255,0.15);

    box-shadow:

    0 0 30px rgba(173,216,255,0.12),

    0 0 60px rgba(173,216,255,0.06);

    animation:floatBox 5s ease-in-out infinite;
}

/* TITLE */

.title{

    color:#f8fbff;

    font-size:clamp(2rem,5vw,3.7rem);

    font-weight:700;

    line-height:1.3;

    text-shadow:

    0 0 10px rgba(255,255,255,0.25),

    0 0 25px rgba(173,216,255,0.15);
}

/* SUBTEXT */

.subtitle{

    margin-top:18px;

    color:rgba(255,255,255,0.82);

    font-size:clamp(1rem,2vw,1.2rem);

    line-height:1.6;
}

/* BUTTON */

.enter-btn{

    margin-top:34px;

    padding:14px 34px;

    border:none;

    border-radius:999px;

    background:rgba(255,255,255,0.14);

    color:white;

    font-size:1rem;

    font-weight:700;

    cursor:pointer;

    backdrop-filter:blur(10px);

    transition:all 0.35s ease;

    box-shadow:
    0 0 20px rgba(255,255,255,0.08);
}

.enter-btn:hover{

    transform:
    translateY(-3px)
    scale(1.04);

    background:rgba(255,255,255,0.22);

    box-shadow:
    0 0 35px rgba(255,255,255,0.16);
}

/* FLOATING EFFECT */

@keyframes floatBox{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-8px);
    }

    100%{
        transform:translateY(0px);
    }
}


/* GIFT SCREEN */

.gift-screen{

position:fixed;

inset:0;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

z-index:50;

transition:0.7s ease;
}

/* GIFT BOX */

.gift-box{

font-size:12rem;

cursor:pointer;

animation:
giftShake 1.8s infinite ease-in-out,
giftGlow 3s infinite ease-in-out;

filter:
drop-shadow(0 0 30px rgba(255,255,255,0.25));

transition:0.4s ease;
}

.gift-box:hover{

transform:
scale(1.08);
}

/* TAP TEXT */

.tap-text{

margin-top:22px;

font-size:1.1rem;

letter-spacing:4px;

color:
rgba(255,255,255,0.85);

animation:
tapFloat 2.5s infinite ease-in-out;
}

/* GIFT SHAKE */

@keyframes giftShake{

0%,100%{
transform:rotate(0deg);
}

20%{
transform:rotate(-6deg);
}

40%{
transform:rotate(6deg);
}

60%{
transform:rotate(-4deg);
}

80%{
transform:rotate(4deg);
}
}

/* GIFT GLOW */

@keyframes giftGlow{

0%,100%{
filter:
drop-shadow(0 0 20px rgba(255,255,255,0.20));
}

50%{
filter:
drop-shadow(0 0 45px rgba(255,255,255,0.45));
}
}

/* FLOAT */

@keyframes tapFloat{

0%,100%{
transform:translateY(0px);
}

50%{
transform:translateY(-6px);
}
}

/* CRACKERS */

.cracker{

position:fixed;

width:10px;
height:10px;

border-radius:50%;

pointer-events:none;

animation:
crackerBlast 4.5s ease-out forwards;
}

@keyframes crackerBlast{

0%{

transform:
translate(0px,0px)
scale(1);

opacity:1;
}

100%{

transform:
translate(var(--x),var(--y))
scale(0);

opacity:0;
}
}

@media(max-width:768px){

    .text-box{

        width:100%;

        max-width:380px;

        padding:30px 22px;
    }

    .gift-box{

        font-size:8rem;
    }

    .tap-text{

        font-size:0.95rem;

        letter-spacing:2px;
    }

    .enter-btn{

        width:100%;
    }

}

</style>

</head>

<body>

<!-- VIDEO -->

<video autoplay muted loop playsinline class="background-video">

    <source src="videos/dreamland.mp4" type="video/mp4">

</video>

<!-- OVERLAY -->

<div class="overlay"></div>

<!-- GIFT SCREEN -->

<div class="gift-screen" id="giftScreen">

    <div class="gift-box" onclick="openGift()">

        🎁

    </div>

    <div class="tap-text">

        tap me ✨

    </div>

</div>

<!-- CRACKER PARTICLES -->

<div class="cracker-container" id="crackerContainer"></div>

<!-- MAIN CONTENT -->

<div class="content hidden-content" id="mainContent">

    <div class="text-box">

        <h1 class="title">
            Welcome to your safe place 🌙
        </h1>

        <p class="subtitle">
            Tap below to enter your comfort universe 🎀✨
        </p>

        <button class="enter-btn" onclick="window.location.href='loader.html'">

            ✨ Enter

        </button>

    </div>

</div>

<script>

function openGift(){


/* HIDE GIFT */

document.getElementById("giftScreen")
.style.opacity = "0";

setTimeout(()=>{

document.getElementById("giftScreen")
.style.display = "none";

},700);

/* CRACKERS */

const container =
document.getElementById("crackerContainer");

for(let i=0;i<140;i++){

const particle =
document.createElement("div");

particle.className =
"cracker";

particle.style.left =
Math.random()*100 + "vw";

particle.style.top =
Math.random()*100 + "vh";

particle.style.background =
`hsl(${Math.random()*360},100%,70%)`;

particle.style.setProperty(
"--x",
`${(Math.random()-0.5)*600}px`
);

particle.style.setProperty(
"--y",
`${(Math.random()-0.5)*600}px`
);

container.appendChild(particle);

setTimeout(()=>{

particle.remove();

},4500);

}

/* SHOW MAIN CONTENT */

setTimeout(()=>{

document.getElementById("mainContent")
.classList.remove("hidden-content");

},900);

}

</script>


</body>
</html>
