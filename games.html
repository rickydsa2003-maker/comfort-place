<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini Games</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
font-family:'Quicksand',sans-serif;
background:linear-gradient(135deg,#071120,#111827,#1b1030);
color:white;
padding:20px;
}

img{
width:90%;
max-width:420px;
border-radius:25px;
box-shadow:0 0 40px rgba(255,255,255,0.12);
margin-bottom:30px;
}

.text{
max-width:700px;
font-size:1.1rem;
line-height:1.8;
color:rgba(255,255,255,0.85);
}

.home-btn{

position:fixed;

top:20px;
left:20px;

padding:12px 22px;

border:none;

border-radius:999px;

background:rgba(255,255,255,0.10);

color:white;

cursor:pointer;

backdrop-filter:blur(10px);

transition:0.3s ease;

z-index:999;
}

.home-btn:hover{

background:rgba(255,255,255,0.18);

transform:
translateY(-2px)
scale(1.03);
}

@media (max-width:768px){

.home-btn{

top:12px;
left:12px;

padding:10px 18px;

font-size:0.9rem;
}

img{

width:85%;

margin-top:50px;
}

.text{

font-size:1rem;

line-height:1.7;

padding:0 10px;
}

}

</style>

</head>

<body>

<button class="home-btn"
onclick="window.location.href='home.html'">

← Home

</button>

<img src="images/minions-games.jpg" alt="Mini Games Minion">

<div class="text">

🎮 Mini Games<br><br>

Work in Progress 🚧<br><br>

The minions are currently testing the games.<br><br>

Unfortunately, they keep getting distracted, pressing random buttons, arguing over bananas, and creating more bugs than they're fixing 😭🍌🎮<br><br>

Ricky promises to update this soon for youuuuu 💛✨

</div>

</body>
</html>
